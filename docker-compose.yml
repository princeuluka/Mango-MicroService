version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: mango-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rewardapi:
    image: ${DOCKER_REGISTRY-}rewardapi
    build:
      context: .
      dockerfile: Mango.Services.RewardAPI/Dockerfile
    container_name: mango-rewardapi
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - "ConnectionStrings:DefaultConnection=Server=mssql;Database=Mango_Reward;User=sa;Password=YourPassword123;TrustServerCertificate=True;"
      - "MessageBus:Host=rabbitmq"
      - "MessageBus:Port=5672"
      - "MessageBus:UserName=guest"
      - "MessageBus:Password=guest"
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "7011:7011"
      - "5023:5023"
